[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmfspeaker-panel-linux"
version = "0.1.0"
description = "Unofficial Linux control panel for CMF Speaker S (Nothing/CMF, model E494) — a Nothing X alternative. EQ + custom EQ, Ultra Bass, spatial, night, battery, find, stereo pair over BLE GATT; local web UI + CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "haosb" }]
keywords = ["cmf", "nothing", "speaker", "bluetooth", "bluez", "gatt"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio",
]
# System packages: python3-dbus and python3-gi (PyGObject), installed by the distro.
dependencies = []

[project.urls]
Homepage = "https://github.com/haosb/cmfspeaker-panel-linux"
Repository = "https://github.com/haosb/cmfspeaker-panel-linux"
Issues = "https://github.com/haosb/cmfspeaker-panel-linux/issues"

[project.scripts]
cmf = "cmf.cli:main"
cmf-ui = "cmf.ui:main"

[tool.setuptools.packages.find]
include = ["cmf*"]

[tool.setuptools.package-data]
cmf = ["ui/*.html", "ui/*.css", "ui/*.js", "ui/fonts/*"]
